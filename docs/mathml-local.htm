<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MathML local verification fixture</title>
  </head>
  <body>
    <p>
      <math xmlns="http://www.w3.org/1998/Math/MathML">
        <mi>A</mi>
        <mo>&#x00D7;</mo>
        <mi>B</mi>
      </math>
    </p>
    <p>
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <msub>
          <mi>&#x03C0;</mi>
          <mn>0</mn>
        </msub>
        <mo stretchy="false">(</mo>
        <mi>X</mi>
        <mo stretchy="false">)</mo>
      </math>
    </p>
    <p>
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mrow>
          <mi>f</mi>
          <mo stretchy="false">(</mo>
          <mi>x</mi>
          <mo stretchy="false">)</mo>
          <mo>=</mo>
          <mfrac>
            <mn>1</mn>
            <mrow>
              <mn>1</mn>
              <mo>+</mo>
              <msup>
                <mi>x</mi>
                <mn>2</mn>
              </msup>
            </mrow>
          </mfrac>
        </mrow>
      </math>
    </p>
  </body>
</html>
